# RealMock backend package (realmock namespace, src layout)
#
# Layout under src/realmock/:
#   platform (platform kernel) / bootstrap (composition-root wiring) /
#   domains/{profile,resume,settings,prep,interview,records,growth}
# Domains depend only on platform (no cross-domain business imports).
# Single-process aggregate entry: realmock.asgi:app.
# Local dev: pip install -e ./apps/api then uvicorn realmock.asgi:app --port 8081.
#
# Dependencies use >= lower bounds with next-major upper caps to avoid
# silent breakage on major upgrades. chromadb 1.5.9 is the latest release and
# carries several known issues with no fixed version yet (PYSEC-2026-311 and
# PYSEC-2026-3813/3814/3815; see the pip-audit ignores in ci.yml). It is a
# required direct dependency (LocalEmbeddingRAG uses PersistentClient embedded
# mode and does not expose a chroma server port, so the attack surface is
# limited). Upgrade when upstream ships a fix.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realmock-api"
version = "0.1.0"
description = "RealMock mock-interview platform API (modular FastAPI monolith)"
# Single supported runtime: 3.14 is the only version CI exercises and the only
# version the Docker image ships, so the floor matches the tested floor rather
# than claiming 3.11-3.13 support nothing verifies.
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0,<1",
    # Declared explicitly: platform/core/error_handlers.py and app_factory.py
    # import starlette directly (it is a mandatory fastapi dependency, but a
    # direct import should not rely on that transitive guarantee).
    "starlette>=0.40.0,<2",
    "uvicorn[standard]>=0.32.0,<1",
    # Cap raised from <2.0.52 to <3 after 2.1.2 verified green: mypy 2.4.0
    # accepts the legacy Query.order_by stubs that 2.0.52 tightened, and the
    # full pytest suite (96.32% coverage) passes. The ~127 legacy
    # Session.query() call sites are still 2.0-style-but-deprecated API, so the
    # next major is not something to opt into without a second verification.
    "sqlalchemy>=2.0.36,<3",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "httpx>=0.28.0,<1",
    "python-multipart>=0.0.17,<1",
    "pypdf>=5.1.0,<7",
    # Image-PDF fallback: render pages to images for vision transcription (lazy-import path)
    "pymupdf>=1.24.0,<2",
    "python-docx>=1.1.2,<2",
    # Cap raised from <16 to <18. The old cap was set before websockets 17
    # existed; the only apparent blocker (langgraph-sdk pinning websockets<16)
    # came from an orphaned langchain install in a shared site-packages, not
    # from this dependency set - a clean resolve of these 19 direct deps
    # pulls 101 packages and no langchain/langgraph. Verified on 17.1.
    "websockets>=12.0,<18",
    "alembic>=1.14.0,<2",
    "edge-tts>=6.1.0,<8",
    "faster-whisper>=1.0.0,<2",
    # Local RAG vector store (embedded PersistentClient; see header note on PYSEC-2026-311)
    "chromadb>=1.5.0,<2",
    "ddgs>=9.0.0,<10",
    "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
# Test tooling only: the runtime install (Docker image) does not need pytest.
# Local dev / CI install: pip install -e './apps/api[dev]'
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
# Pin python_version to 3.14, matching the CI python-version and the
# python:3.14-slim image. Anything lower would type-check syntax that can
# never reach production; anything higher is not yet in CI.
python_version = "3.14"
# Type-check against the deployment/CI platform (python:3.14-slim on Linux),
# not the developer OS; POSIX-only APIs (os.killpg, pwd, ...) are real there.
platform = "linux"
ignore_missing_imports = true
no_incremental = true
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
# Runtime floor is 3.14 (see requires-python), but the formatter target stays
# at py313 on purpose. At py314 ruff applies PEP 758 and strips the
# parentheses from every `except (A, B):`, rewriting 72 files to
# `except A, B:` - valid on 3.14, unreadable to most reviewers, and a hard
# import-time break on 3.13 for no functional gain. target-version is ruff's
# "oldest supported syntax" knob, so holding it one notch below the runtime
# keeps the committed style conventional. Raise it (and accept the reformat)
# only if the floor moves to 3.14 permanently.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Pin rule set to avoid CI drift from ruff 0.16+ default expansion.
# I (isort) and the formatter are what E501 defers to; both are now enforced.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort - import order
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line length handled by formatter; long strings/URLs stay as-is
    # Naming rules that conflict with deliberate choices in this codebase:
    #   N818 - domain exceptions are named for the condition, not the category.
    #          AgentHalt is a control-flow signal (the agent is waiting on the
    #          user), not an error; FileLockTimeout says exactly what it is.
    #          Renaming either to *Error would make them less accurate.
    "N818",
    #   N814/N817 - tests deliberately abbreviate CamelCase imports (NS, TO,
    #          SE, _LP). PEP 8 prefers the full name; the short form is what
    #          makes the assertions readable.
    "N814",
    "N817",
    #   N802 - SessionsSessionLocal is a PascalCase proxy for the symbol it
    #          wraps (database.SessionsSessionLocal) and must not drift from it.
    "N802",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use looser assert/helper style
"**/tests/**" = ["E712"]
