<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Blurred bookshelf wall -->
  <g opacity="0.35">
    <rect x="40" y="80" width="200" height="520" rx="4" fill="#334155"/>
    <rect x="60" y="110" width="70" height="90" rx="2" fill="#475569"/>
    <rect x="145" y="110" width="70" height="90" rx="2" fill="#475569"/>
    <rect x="60" y="220" width="70" height="90" rx="2" fill="#64748b"/>
    <rect x="145" y="220" width="70" height="90" rx="2" fill="#64748b"/>
    <rect x="60" y="330" width="155" height="100" rx="2" fill="#475569"/>
    <rect x="960" y="100" width="180" height="480" rx="4" fill="#334155"/>
    <rect x="980" y="130" width="60" height="80" rx="2" fill="#475569"/>
    <rect x="1055" y="130" width="60" height="80" rx="2" fill="#64748b"/>
    <rect x="980" y="230" width="140" height="90" rx="2" fill="#475569"/>
  </g>
  <!-- Main monitor frame -->
  <rect x="280" y="90" width="640" height="420" rx="16" fill="#020617" stroke="#475569" stroke-width="3"/>
  <rect x="300" y="110" width="600" height="360" rx="8" fill="url(#screen)"/>
  <!-- Video conference UI -->
  <rect x="320" y="130" width="260" height="160" rx="8" fill="#1e293b" opacity="0.9"/>
  <circle cx="450" cy="195" r="36" fill="#334155"/>
  <circle cx="450" cy="185" r="16" fill="#94a3b8"/>
  <ellipse cx="450" cy="220" rx="24" ry="14" fill="#94a3b8"/>
  <rect x="600" y="130" width="280" height="160" rx="8" fill="#0f172a" opacity="0.85"/>
  <text x="740" y="215" text-anchor="middle" fill="#64748b" font-size="18" font-family="sans-serif">RealMock</text>
  <rect x="320" y="310" width="560" height="40" rx="6" fill="#020617" opacity="0.6"/>
  <circle cx="360" cy="330" r="10" fill="#ef4444"/>
  <circle cx="400" cy="330" r="10" fill="#22c55e"/>
  <circle cx="440" cy="330" r="10" fill="#3b82f6"/>
  <!-- Ring light -->
  <ellipse cx="600" cy="560" rx="200" ry="28" fill="url(#glow)"/>
  <ellipse cx="600" cy="540" rx="120" ry="14" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.7"/>
  <ellipse cx="600" cy="540" rx="90" ry="10" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.25"/>
  <!-- Desktop -->
  <path d="M200 620 L1000 620 L1080 760 L120 760 Z" fill="#1e293b"/>
  <path d="M220 620 L980 620" stroke="#475569" stroke-width="2" opacity="0.5"/>
  <!-- Keyboard and mouse -->
  <rect x="420" y="660" width="280" height="40" rx="4" fill="#0f172a"/>
  <ellipse cx="760" cy="680" rx="22" ry="14" fill="#334155"/>
  <!-- Status indicator -->
  <circle cx="80" cy="60" r="8" fill="#22c55e"/>
  <text x="100" y="66" fill="#94a3b8" font-size="16" font-family="sans-serif">ONLINE INTERVIEW · LIVE</text>
  <!-- Vignette -->
  <defs>
    <radialGradient id="vig" cx="50%" cy="40%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
