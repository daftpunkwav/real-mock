# gitleaks configuration. Extends the default rule set; the allowlists cover
# fabricated credentials in the backend test tree - each entry requires BOTH
# the fixture path AND a value pattern (condition = "AND"), so a real
# credential pasted into a test only escapes the scan if it also looks like
# one of the documented fabrication families. Anything else stays loud.
#
# Fabrication families (from apps/api/tests fixtures):
#   sk-*            - OpenAI-style fake keys
#   enc:*           - encrypted-at-rest fixture values
#   named constants - test-key / test_key / asr-key / env-key / plain-key /
#                     legacy-secret / stage-secret
#   BAIDU*          - Baidu voice client fixtures
#   MIIEvQ          - the truncated dummy PEM body

[extend]
useDefault = true

[[allowlists]]
description = "fabricated API keys in backend test fixtures"
condition = "AND"
paths = ['''apps/api/tests/''']
regexes = [
  '''^sk-''',
  '''^enc:''',
  '''^(test-key|test_key|asr-key|env-key|plain-key|legacy-secret|stage-secret)$''',
  '''^BAIDU(KEY123|SECRET456)$''',
  '''^(cov-rep2|abcdef1234567890|abcdefghijklmnop|abcdefghijklmnopqrstuvwx|long-enough-secret-123|plain-text-key-long-enough-xyz|short)''',
]

[[allowlists]]
description = "truncated dummy PEM fixture bodies in the redaction/security tests"
condition = "AND"
paths = ['''apps/api/tests/platform_core/''']
regexes = ['''MIIEv''']
