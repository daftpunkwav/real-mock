# Dependabot configuration.
#
# Three ecosystems are tracked:
#   github-actions -> keeps the pinned action SHAs in .github/workflows/ci.yml current
#                     without ever letting a tag move silently under us.
#   npm            -> apps/web (package-lock.json is the only install source).
#   pip            -> apps/api/pyproject.toml. Upper caps are explicit constraints
#                     (see the file header); Dependabot only proposes bumps that stay
#                     inside them, and CI remains the gate.
#
# Every group keeps the PR count low so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "/apps/api"
    # Upper caps in apps/api/pyproject.toml are deliberate and documented there.
    # SQLAlchemy 2.0.52+ tightened the legacy Query.order_by overloads and broke
    # mypy on CI; websockets is capped at the locally tested range. Dependabot
    # widens those caps on its own, so ignore anything at or above them and let a
    # human raise the cap once the code is actually ready for it.
    ignore:
      - dependency-name: "sqlalchemy"
        versions: [">=2.0.52"]
      - dependency-name: "websockets"
        versions: [">=16"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-py)"
    labels:
      - "dependencies"
      - "python"
    groups:
      pip:
        patterns: ["*"]
