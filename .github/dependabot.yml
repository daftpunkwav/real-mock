# Dependabot configuration.
#
# Three ecosystems are tracked:
#   github-actions -> keeps the pinned action SHAs in .github/workflows/ci.yml current
#                     without ever letting a tag move silently under us.
#   npm            -> apps/web (package-lock.json is the only install source).
#   pip            -> apps/api/pyproject.toml. Upper caps are explicit constraints
#                     (see the file header); Dependabot only proposes bumps that stay
#                     inside them, and CI remains the gate.
#
# Every group keeps the PR count low so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
    # "Highest usable" caps: these majors are blocked by the dependency tree
    # itself, not by preference. typescript >=6 fails openapi-typescript@7's
    # peer range typescript@^5.x at install time (npm ERESOLVE, see PR #17);
    # @types/node tracks the runtime major pinned in ci.yml/.nvmrc (24), so
    # bump both together when the runtime moves (Node 26 is LTS 2026-10-28).
    ignore:
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: "pip"
    directory: "/apps/api"
    # No version ignores. The SQLAlchemy (<2.0.52) and websockets (<16) caps
    # that used to live here were removed once 2.1.2 / 17.1 verified green, so
    # Dependabot will now propose the next major as an ordinary PR and the
    # backend gate decides - which is the intent, not something to pre-filter.
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-py)"
    labels:
      - "dependencies"
      - "python"
    groups:
      pip:
        patterns: ["*"]
