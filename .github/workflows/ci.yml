# CI: runs on push to main and all Pull Requests
# Backend and frontend jobs run in parallel; commands match local verification
# (toolchain versions are pinned — see backend step comments).
# Every "uses:" is pinned to a full commit SHA: tags are mutable, so a moved tag
# would silently change what runs here. Dependabot (github-actions ecosystem)
# bumps these SHAs in a PR - never edit them by hand without matching the version
# comment on the same line.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only check out code and publish no artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff / mypy / pytest / audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODE: "1"
      ENV: "dev"
      LLM_API_KEY: "test-key"
      LLM_API_BASE: "http://127.0.0.1:9999/v1"
      CORS_ORIGINS: "http://localhost:8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install deps and toolchain
        # Pin toolchain (matches local verification): ruff 0.16 default rule expansion causes ~252 findings
        run: |
          pip install -q -e 'apps/api[dev]'
          pip install -q ruff==0.15.20 mypy==2.1.0 pytest-cov==7.1.0 pip-audit==2.10.1

      - name: OpenAPI contract is in sync (openapi.json)
        # openapi.json is committed and is the source the frontend generates its
        # types from (npm run generate:api-types). Regenerating it here and
        # failing on drift turns "someone changed a route signature and forgot
        # to re-export" into a build failure instead of a silent mismatch.
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

      - name: ruff static check
        run: python -m ruff check apps/api

      - name: mypy typecheck
        # Full-package typecheck (matches local verification); blocking since the tree is clean
        working-directory: apps/api
        run: python -m mypy src

      - name: pytest full regression + coverage gate (>=90%)
        working-directory: apps/api
        run: >
          python -m pytest -q
          --cov=realmock.platform --cov=realmock.domains.profile --cov=realmock.domains.resume
          --cov=realmock.domains.settings --cov=realmock.domains.prep --cov=realmock.domains.interview
          --cov=realmock.domains.growth
          --cov-report=term-missing --cov-fail-under=90

      - name: pip-audit dependency scan
        # Audit the current env (including editable realmock-api deps).
        # chromadb 1.5.9 (latest) known issues with no fixed release yet
        # (see pyproject comments); re-check when upstream ships a fix.
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  frontend:
    name: Frontend (tsc / lint / test / build / audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit (fail on unlisted high+)
        # npm audit has no per-advisory ignore flag: scripts/npm-audit-check.mjs
        # enforces npm-audit-allowlist.json (mirrors the pip-audit --ignore-vuln
        # pattern for unfixable upstream with unreachable entry points).
        run: npm run audit
  docker:
    name: Docker (backend + web image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - name: Build backend image
        # The deployable artifact is a container. Without this, a typo in a
        # COPY path or a command that only works on Windows ships green and
        # breaks at deploy time. Root context: .dockerignore keeps the build to
        # apps/api plus the stt_fixtures.
        run: docker build --tag realmock-api:ci .

      - name: Build web image
        # Context is apps/web; its .dockerignore already drops node_modules and
        # .next, so this does not copy the 900 MB of local build state.
        run: docker build --tag realmock-web:ci apps/web

  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - name: actionlint
        # Catches workflow syntax errors, bad expressions and shellcheck issues
        # in run blocks - the class of mistake that only shows up as a confusing
        # red X in the Actions tab. Installed as a pinned release binary, so this
        # adds no third-party action to the allow list.
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSfL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Audits the workflows themselves for unsafe expression expansion,
        # excessive permissions and unpinned actions. Complements actionlint: one
        # checks that the YAML is correct, the other that it is safe.
        run: |
          set -euo pipefail
          version=1.30.1
          curl -sSfL --retry 3 -o /tmp/zizmor.tar.gz \
            "https://github.com/woodruffw/zizmor/releases/download/v${version}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zizmor.tar.gz -C /usr/local/bin
          zizmor --persona=pedantic --min-severity=medium .github/workflows/
  repo-hygiene:
    name: Repo hygiene (case collisions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No case-insensitive path collisions
        # The worktree is developed on Windows, where the filesystem cannot hold
        # two paths differing only by case - so a colliding pair is easy to create
        # in review and impossible to reproduce locally. Linux (CI) accepts it
        # silently and every other Windows/macOS clone then breaks. Git only warns
        # at checkout time, so this is the only place it can be enforced.
        run: python3 scripts/ci/check_case_collisions.py