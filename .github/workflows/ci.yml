# CI: push to main + all PRs, routed by the "changes" job so each heavy gate
# runs only when its area changed. No paths-ignore on the triggers: a skipped
# workflow would leave the required "gate" check absent and deadlock merges.
# "uses:" are SHA-pinned (dependabot bumps them); "gate" is the one required
# check and aggregates every job below.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only check out code and publish no artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: push-event bases can be arbitrarily far back.
          fetch-depth: 0

      - name: Compute per-area switches
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "diff base unavailable ($EVENT_NAME) - running every gate"
            printf 'backend=%s\nfrontend=%s\ndocker=%s\nworkflows=%s\n' \
              true true true true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed"
          backend=false
          frontend=false
          docker=false
          workflows=false
          if grep -qE '^apps/api/|^scripts/export_openapi\.py$|^openapi\.json$' <<< "$changed"; then
            backend=true
          fi
          if grep -qE '^apps/web/|^openapi\.json$' <<< "$changed"; then
            frontend=true
          fi
          if [ "$backend" = true ] || [ "$frontend" = true ] \
            || grep -qE '^Dockerfile$|^apps/web/Dockerfile$' <<< "$changed"; then
            docker=true
          fi
          if grep -qE '^\.github/' <<< "$changed"; then
            workflows=true
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "docker=$docker"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (ruff / mypy / pytest / audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODE: "1"
      ENV: "dev"
      LLM_API_KEY: "test-key"
      LLM_API_BASE: "http://127.0.0.1:9999/v1"
      CORS_ORIGINS: "http://localhost:8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No pushes here; keep the checkout token off disk.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install deps and toolchain
        # Pinned toolchain; bump only after the gate passes locally.
        run: |
          pip install -q -e 'apps/api[dev]'
          pip install -q ruff==0.16.10 mypy==2.4.0 pytest-cov==7.1.0 pip-audit==2.10.1

      - name: OpenAPI contract is in sync (openapi.json)
        # openapi.json is committed and feeds the frontend types; drift means
        # a route changed without re-exporting.
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

      - name: ruff static check
        run: python -m ruff check apps/api

      - name: ruff format check
        # Line length is the formatter's job (.editorconfig ignores E501).
        run: python -m ruff format --check apps/api

      - name: mypy typecheck
        # Matches local verification.
        working-directory: apps/api
        run: python -m mypy src

      - name: pytest full regression + coverage gate (>=90%)
        # Whole-package coverage: new domains are measured automatically.
        working-directory: apps/api
        run: >
          python -m pytest -q
          --cov=realmock
          --cov-report=term-missing --cov-fail-under=90

      # Audits + denylist live in security.yml (scheduled; CVEs need no code change).

  frontend:
    name: Frontend (tsc / lint / test / build / audit)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Prettier format check
        # Prettier owns formatting (eslint rules disabled). Linux-only gate:
        # autocrlf checkouts can never satisfy a LF format check.
        run: npm run format:check

      - name: i18n usage audit (ghost + dead keys)
        # Ghost/dead key scan: resolve.ts falls back silently, hiding both.
        run: node scripts/check-i18n-usage.mjs

      # Audit + denylist live in security.yml (scheduled; CVEs need no code change).
  docker:
    name: Docker (backend + web image builds)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        # The deployable artifact; root context (.dockerignore trims to apps/api).
        run: docker build --tag realmock-api:ci .

      - name: Build web image
        # apps/web context; its .dockerignore drops local build state.
        run: docker build --tag realmock-web:ci apps/web

  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        # Workflow syntax + shellcheck errors, as a pinned binary.
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSfL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Workflow security audit (permissions, injection, pinning).
        run: |
          set -euo pipefail
          version=1.30.1
          curl -sSfL --retry 3 -o /tmp/zizmor.tar.gz \
            "https://github.com/woodruffw/zizmor/releases/download/v${version}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zizmor.tar.gz -C /usr/local/bin
          zizmor --persona=pedantic --min-severity=medium .github/workflows/
  repo-hygiene:
    name: Repo hygiene (case collisions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Committed files match .editorconfig
        # Checked against git blobs, not the working tree: autocrlf checkouts
        # would false-positive on nearly every file.
        run: python3 scripts/ci/check_editorconfig.py

      - name: No case-insensitive path collisions
        # Case collisions are invisible on Windows dev machines and break other
        # clones; only Linux CI can catch them.
        run: python3 scripts/ci/check_case_collisions.py

      - name: Documentation bilingual pairs
        # docs/ ships as X.md + X.zh.md pairs (root README included).
        run: python3 scripts/ci/check_docs_pairs.py

      - name: Documentation internal links (lychee, offline)
        # Internal links only (--offline): network-free, flake-free.
        run: |
          set -euo pipefail
          version=0.24.2
          curl -sSfL --retry 3 -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          install "$(find /tmp -maxdepth 2 -name lychee -type f | head -1)" /usr/local/bin/lychee
          lychee --offline --no-progress 'docs/**/*.md' 'README.md' 'README.zh.md' '*.md'

  gate:
    name: gate
    # The one required check: green iff every job that ran is green;
    # failure or cancellation is red.
    needs: [changes, backend, frontend, docker, workflow-lint, repo-hygiene]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          REPO_HYGIENE: ${{ needs.repo-hygiene.result }}
        run: |
          set -euo pipefail
          results="changes=$CHANGES backend=$BACKEND frontend=$FRONTEND docker=$DOCKER workflow_lint=$WORKFLOW_LINT repo_hygiene=$REPO_HYGIENE"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all triggered gates passed (skipped areas excluded)"
