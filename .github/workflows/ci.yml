# CI: runs on push to main and all Pull Requests
# Backend and frontend jobs run in parallel; commands match local verification
# (toolchain versions are pinned — see backend step comments).
# Every "uses:" is pinned to a full commit SHA: tags are mutable, so a moved tag
# would silently change what runs here. Dependabot (github-actions ecosystem)
# bumps these SHAs in a PR - never edit them by hand without matching the version
# comment on the same line.
#
# Execution strategy:
#   - The "changes" job diffs the trigger against its base and flips per-area
#     switches (backend / frontend / docker / workflows); heavy jobs only run
#     when their area changed. There is intentionally NO paths-ignore on the
#     triggers: the "gate" job is a required status check for merging, and a
#     workflow skipped by path filtering would leave that check absent, which
#     deadlocks the merge. Docs-only diffs flow through as "nothing changed"
#     and gate passes with every heavy job skipped.
#   - "gate" is always the last word: it passes when every job that ran is
#     green and fails on any failure/cancellation. Branch protection requires
#     exactly this one check (plus the review bots), so the required-checks
#     list stays stable while jobs come and go.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only check out code and publish no artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the diff base on push events (github.event.before) can
          # be arbitrarily far back, and a shallow clone would make the range
          # undiffable. No LFS download: only path names are read here.
          fetch-depth: 0

      - name: Compute per-area switches
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "diff base unavailable ($EVENT_NAME) - running every gate"
            printf 'backend=%s\nfrontend=%s\ndocker=%s\nworkflows=%s\n' \
              true true true true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed"
          backend=false
          frontend=false
          docker=false
          workflows=false
          if grep -qE '^apps/api/|^scripts/export_openapi\.py$|^openapi\.json$' <<< "$changed"; then
            backend=true
          fi
          if grep -qE '^apps/web/|^openapi\.json$' <<< "$changed"; then
            frontend=true
          fi
          if [ "$backend" = true ] || [ "$frontend" = true ] \
            || grep -qE '^Dockerfile$|^apps/web/Dockerfile$' <<< "$changed"; then
            docker=true
          fi
          if grep -qE '^\.github/' <<< "$changed"; then
            workflows=true
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "docker=$docker"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (ruff / mypy / pytest / audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODE: "1"
      ENV: "dev"
      LLM_API_KEY: "test-key"
      LLM_API_BASE: "http://127.0.0.1:9999/v1"
      CORS_ORIGINS: "http://localhost:8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install deps and toolchain
        # Toolchain pinned to the versions this gate was last verified green
        # on. An older revision of this file held ruff at 0.15.20 because a
        # 0.16 pre-release expanded the default rule set; the rule selection in
        # pyproject.toml is explicit (E/F/I/N) and 0.16.10 reports zero findings,
        # so the cap is gone. Bump only after this gate passes locally.
        run: |
          pip install -q -e 'apps/api[dev]'
          pip install -q ruff==0.16.10 mypy==2.4.0 pytest-cov==7.1.0 pip-audit==2.10.1

      - name: OpenAPI contract is in sync (openapi.json)
        # openapi.json is committed and is the source the frontend generates its
        # types from (npm run generate:api-types). Regenerating it here and
        # failing on drift turns "someone changed a route signature and forgot
        # to re-export" into a build failure instead of a silent mismatch.
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

      - name: ruff static check
        run: python -m ruff check apps/api

      - name: ruff format check
        # .editorconfig ignores E501 with the note that line length is the
        # formatter's job; this is that job being checked. Run `ruff format`
        # locally and the gate goes green.
        run: python -m ruff format --check apps/api

      - name: mypy typecheck
        # Full-package typecheck (matches local verification); blocking since the tree is clean
        working-directory: apps/api
        run: python -m mypy src

      - name: pytest full regression + coverage gate (>=90%)
        working-directory: apps/api
        run: >
          python -m pytest -q
          --cov=realmock.platform --cov=realmock.domains.profile --cov=realmock.domains.resume
          --cov=realmock.domains.settings --cov=realmock.domains.prep --cov=realmock.domains.interview
          --cov=realmock.domains.growth
          --cov-report=term-missing --cov-fail-under=90

      - name: pip-audit dependency scan
        # Audit the current env (including editable realmock-api deps).
        # chromadb 1.5.9 (latest) known issues with no fixed release yet
        # (see pyproject comments); re-check when upstream ships a fix.
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

      - name: Dependency policy (denylist)
        # A ban in scripts/ci/dependency-policy.json blocks the package on any
        # path of arrival: this scans the installed environment, so transitive
        # introductions are caught too.
        run: python scripts/ci/check_python_deps_policy.py

  frontend:
    name: Frontend (tsc / lint / test / build / audit)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Prettier format check
        # Prettier owns formatting; the ESLint rules that would also report
        # formatting are disabled in eslint.config.mjs. Runs on Linux CI where
        # core.autocrlf does not rewrite the checkout to CRLF - with autocrlf on
        # Windows the working tree can never satisfy a LF-formatted gate.
        run: npm run format:check

      - name: Dependency audit (fail on unlisted high+)
        # npm audit has no per-advisory ignore flag: scripts/npm-audit-check.mjs
        # enforces npm-audit-allowlist.json (mirrors the pip-audit --ignore-vuln
        # pattern for unfixable upstream with unreachable entry points).
        run: npm run audit

      - name: Dependency policy (denylist)
        # Scans package-lock.json (the full resolved graph, transitive
        # included) plus the manifest against scripts/ci/dependency-policy.json.
        run: node ../../scripts/ci/check_npm_deps_policy.mjs

      - name: i18n usage audit (ghost + dead keys)
        # resolve.ts falls back silently on a missing key, so only a
        # structural scan catches typos (ghosts) and unreferenced entries
        # (dead); the allowlist next to the script carries the audited stock.
        run: node scripts/check-i18n-usage.mjs
  docker:
    name: Docker (backend + web image builds)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes; leaving the checkout token on disk would
          # let anything in a later step (or a cached artifact) reuse it.
          persist-credentials: false

      - name: Build backend image
        # The deployable artifact is a container. Without this, a typo in a
        # COPY path or a command that only works on Windows ships green and
        # breaks at deploy time. Root context: .dockerignore keeps the build to
        # apps/api plus the stt_fixtures.
        run: docker build --tag realmock-api:ci .

      - name: Build web image
        # Context is apps/web; its .dockerignore already drops node_modules and
        # .next, so this does not copy the 900 MB of local build state.
        run: docker build --tag realmock-web:ci apps/web

  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        # Catches workflow syntax errors, bad expressions and shellcheck issues
        # in run blocks - the class of mistake that only shows up as a confusing
        # red X in the Actions tab. Installed as a pinned release binary, so this
        # adds no third-party action to the allow list.
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSfL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Audits the workflows themselves for unsafe expression expansion,
        # excessive permissions and unpinned actions. Complements actionlint: one
        # checks that the YAML is correct, the other that it is safe.
        run: |
          set -euo pipefail
          version=1.30.1
          curl -sSfL --retry 3 -o /tmp/zizmor.tar.gz \
            "https://github.com/woodruffw/zizmor/releases/download/v${version}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zizmor.tar.gz -C /usr/local/bin
          zizmor --persona=pedantic --min-severity=medium .github/workflows/
  repo-hygiene:
    name: Repo hygiene (case collisions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Committed files match .editorconfig
        # .editorconfig configures editors; until now nothing read it, so files
        # landed with CRLF, missing final newlines and extra blank lines at EOF.
        # Runs against git blobs, not the working tree: core.autocrlf=true puts
        # CRLF in every checkout, so a working-tree scan would be ~1300 false
        # positives.
        run: python3 scripts/ci/check_editorconfig.py

      - name: No case-insensitive path collisions
        # The worktree is developed on Windows, where the filesystem cannot hold
        # two paths differing only by case - so a colliding pair is easy to create
        # in review and impossible to reproduce locally. Linux (CI) accepts it
        # silently and every other Windows/macOS clone then breaks. Git only warns
        # at checkout time, so this is the only place it can be enforced.
        run: python3 scripts/ci/check_case_collisions.py

      - name: Documentation bilingual pairs
        # docs/ ships as X.md + X.zh.md pairs; a rename or a new page landing
        # in one language only would orphan readers of the other. The root
        # README pair is included.
        run: python3 scripts/ci/check_docs_pairs.py

      - name: Documentation internal links (lychee, offline)
        # Internal links and anchors across the docs tree. --offline keeps the
        # check network-free and flake-free: external URLs are excluded by
        # design (they belong to a scheduled job, not a per-PR gate).
        run: |
          set -euo pipefail
          version=0.24.2
          curl -sSfL --retry 3 -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          install "$(find /tmp -maxdepth 2 -name lychee -type f | head -1)" /usr/local/bin/lychee
          lychee --offline --no-progress 'docs/**/*.md' 'README.md' 'README.zh.md' '*.md'

  gate:
    name: gate
    # Merge-time summary: branch protection requires exactly this check. It
    # always runs, passes when every job that ran succeeded (skipped areas are
    # fine - that is the path filtering above) and fails on any failure or
    # cancellation, so a cancelled run can never masquerade as green.
    needs: [changes, backend, frontend, docker, workflow-lint, repo-hygiene]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          REPO_HYGIENE: ${{ needs.repo-hygiene.result }}
        run: |
          set -euo pipefail
          results="changes=$CHANGES backend=$BACKEND frontend=$FRONTEND docker=$DOCKER workflow_lint=$WORKFLOW_LINT repo_hygiene=$REPO_HYGIENE"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all triggered gates passed (skipped areas excluded)"
